<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ramal — trens do Rio</title>
  <meta name="description" content="Próximos trens, rotas, horários e avisos dos trens do Rio de Janeiro.">
  <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0f17" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%231f4fe0'/%3E%3Cpath d='M12 25V7M12 18c0-4 3-6.5 9-6.5' stroke='%23fff' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='21' cy='11.5' r='2.6' fill='%23ffcf33'/%3E%3C/svg%3E">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" integrity="sha512-h9FcoyWjHcOcmEVkxOfTLnmZFWIH0iZhZT1H2TbOq55xssQGEJHEaIm+PgoUaZbRvQTNTluNOEfb1ZRy6D3BOw==" crossorigin="">
  <link rel="stylesheet" href="styles.css?v=23">
</head>
<body>
  <a class="skip" href="#main">Pular para o conteúdo</a>

  <header class="appbar">
    <div class="appbar-in">
      <a class="logo" href="#/" aria-label="Ramal, início">
        <svg class="logo-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9"/><path d="M12 25V7M12 18c0-4 3-6.5 9-6.5"/><circle cx="21" cy="11.5" r="2.6"/></svg>
        <span class="logo-word">Ramal</span>
      </a>
      <nav class="topnav" aria-label="Seções" data-nav></nav>
      <button class="status" id="status" type="button" aria-haspopup="dialog">
        <span class="status-dot"></span><span id="status-text">Demonstração</span>
      </button>
    </div>
  </header>

  <main id="main" class="page">
    <div id="v-inicio" class="view" hidden></div>
    <div id="v-rota" class="view" hidden></div>
    <div id="v-linhas" class="view" hidden></div>
    <div id="v-linha" class="view" hidden></div>
    <div id="v-estacao" class="view" hidden></div>
    <div id="v-avisos" class="view" hidden></div>
    <div id="v-mapa" class="view" hidden></div>
    <footer class="foot">
      <p class="foot-online" id="online" hidden></p>
      <p>Ramal é um projeto independente, sem vínculo com a operadora dos trens nem com o Governo do Estado.</p>
      <p class="apoio"><a class="apoio-btn" id="apoio" href="apoio.html" target="_blank" rel="noopener">Ajude a manter o site no ar</a>
</p>
      <p><a href="privacidade.html">Política de privacidade</a></p>
    </footer>
  </main>

  <nav class="tabbar" aria-label="Seções" data-nav></nav>

  <dialog id="picker" class="sheet" aria-labelledby="picker-title">
    <div class="sheet-grip" aria-hidden="true"></div>
    <div class="sheet-head">
      <h2 id="picker-title">Escolher estação</h2>
      <button class="text-btn" type="button" data-close>Fechar</button>
    </div>
    <label class="search">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="picker-q" type="search" placeholder="Buscar estação" autocomplete="off" aria-label="Buscar estação" enterkeyhint="go">
    </label>
    <div id="picker-list" class="picker-list"></div>
  </dialog>

  <dialog id="action" class="sheet small" aria-labelledby="action-title">
    <div class="sheet-grip" aria-hidden="true"></div>
    <div class="sheet-head">
      <h2 id="action-title"></h2>
      <button class="text-btn" type="button" data-close>Fechar</button>
    </div>
    <div id="action-body" class="action-body"></div>
  </dialog>

  <dialog id="info" class="sheet small" aria-labelledby="info-title">
    <div class="sheet-grip" aria-hidden="true"></div>
    <div class="sheet-head">
      <h2 id="info-title">Sobre os dados</h2>
      <button class="text-btn" type="button" data-close>Fechar</button>
    </div>
    <div id="info-body" class="info-body"></div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script>
    // Estatística de visitas: código da sua conta no GoatCounter (ex.: 'ramal'). Vazio = desligado.
    window.RAMAL_GOATCOUNTER = '';
  </script>
  <script src="gtfs-data.js?v=21"></script>
  <script src="oficial-data.js?v=21"></script>
  <script src="data.js?v=21"></script>
  <script src="schedule.js?v=21"></script>
  <script src="community.js?v=23"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" integrity="sha512-puJW3E/qXDqYp9IfhAI54BJEaWIfloJ7JWs7OeD5i6ruC9JZL1gERT1wjtwXFlh7CjE7ZJ+/vcRZRkIYIb6p4g==" crossorigin=""></script>
  <script src="app.js?v=23"></script>
</body>
</html>
